# Rate limiting zone for auth endpoints: 10MB tracks ~160,000 active client IPs at 15 req/min
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        image/svg+xml;

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Strict Rate-Limited Auth Endpoints to mitigate L7 DDoS and credential stuffing
    location ~ ^/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API and Backend Endpoints Reverse Proxy
    location ~ ^/(query|approvals|questions|auth|conversations|health|ready|api) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable buffering for real-time SSE streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generous timeouts for LLM reasoning and agent queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
