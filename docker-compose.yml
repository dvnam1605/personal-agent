# Local development stack. Secrets come from the environment (see .env.example);
# Compose refuses to start if POSTGRES_PASSWORD / REDIS_PASSWORD are unset (H6).
# The backend is pinned to ENVIRONMENT=development (relaxed auth, debug pages), so every
# port is published on 127.0.0.1 only: nothing here is reachable from other machines.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: assistant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - assistant_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assistant_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - assistant_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    # Requires NVIDIA Container Toolkit + Docker GPU support (GTX 1650 / etc.).
    # Without toolkit, compose still starts but torch.cuda.is_available() stays False.
    gpus: all
    environment:
      - PYTHONPATH=/app
      - DATABASE__URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS__URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=development
      - DEPLOY_TARGET=local
      - DEBUG=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WINDOWS_HOST_IP=${WINDOWS_HOST_IP:-}
      # Only the nginx container may set X-Forwarded-For for rate limiting.
      - 'SECURITY__TRUSTED_PROXIES=["10.249.20.10/32"]'
    # host-gateway tracks host IP dynamically, or falls back to WINDOWS_HOST_IP in WSL
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST_IP:-host-gateway}"
    volumes:
      - ./app:/app/app
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./.secrets:/app/.secrets
      - ./models:/app/models
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - assistant_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assistant_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - backend
    networks:
      assistant_net:
        ipv4_address: 10.249.20.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

# Explicit subnet so Docker never picks a range that collides with the LAN
# (192.168.x.x) or with other projects' bridges on the host.
networks:
  assistant_net:
    name: assistant_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.249.20.0/24
          gateway: 10.249.20.1
