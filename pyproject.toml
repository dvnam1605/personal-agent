[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "Personal Multi-Agent AI Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pgvector>=0.3.6",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.11.0",
    "psycopg[binary]>=3.3.4",
    "docling>=2.59,<3",
    # Explicit floors: transitive pins resolved to pillow 10.4.0 / pyyaml
    # 6.0.2, which have no CPython 3.13+/3.14 wheels and fail to build from
    # source. Keep these floors until docling's chain lifts them.
    "pillow>=11.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
# surya-ocr (optional `ocr-surya` extra) caps pillow<11 and paddleocr
# (optional `ocr-paddle` extra) pins pyyaml==6.0.2 exactly. Left unchecked,
# uv's universal resolution forces those old versions into EVERY split and
# breaks CPython 3.13+/3.14 (no wheels, source build fails). Override both
# caps globally; the OCR extras are isolated from the assistant runtime per
# P9E-2 — they run on a separate strong-GPU machine and are never imported
# by app/.
override-dependencies = ["pillow>=11.0", "pyyaml>=6.0.3"]

[project.optional-dependencies]
# Local embedding/rerank backends (embedding.py, rerank.py) import these lazily.
# Install with: uv sync --extra ml
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "huggingface-hub>=0.23",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "aiosqlite>=0.20.0",
]
# P9E-2 dependency isolation: OCR engines NEVER enter the assistant runtime;
# install these only on the external strong-GPU machine (see docs snippet).
ocr-paddle = [
    "paddleocr>=3.7,<4",
    "paddlepaddle>=3.2.0",
]
ocr-surya = [
    "surya-ocr>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "deepseek-harness",
    "TencentDB-Agent-Memory",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "BLE", # blind except Exception (L5)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long handled by formatter
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
norecursedirs = [".*", "deepseek-harness", "TencentDB-Agent-Memory", "data"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "deepseek-harness", "TencentDB-Agent-Memory", "data"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
